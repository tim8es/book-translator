name: Actor checks

on:
  push:
    branches:
      - apify-managed-llm-mvp
  pull_request:
    paths:
      - "actor_src/**"
      - ".actor/**"
      - "Dockerfile"
      - "requirements-actor.txt"
      - ".github/workflows/actor-check.yml"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q actor_src scripts
      - name: Validate Actor JSON
        run: |
          python -m json.tool .actor/actor.json >/dev/null
          python -m json.tool .actor/INPUT_SCHEMA.json >/dev/null
      - name: Load workflow CLI
        run: python scripts/book.py --help >/dev/null
