name: One-shot verified Good Intentions source restore

on:
  push:
    branches:
      - work/good-intentions-ru-20260903
    paths:
      - .github/workflows/one-shot-restore-good-intentions.yml

permissions:
  contents: write
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/good-intentions-ru-20260903
          fetch-depth: 0

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml

      - name: Download captured transport EPUB
        uses: actions/download-artifact@v4
        with:
          name: good-intentions-current-epub
          path: /tmp/good-intentions-current
          github-token: ${{ github.token }}
          run-id: 33776799289

      - name: Verify transport EPUB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p books/good-intentions/source
          cp /tmp/good-intentions-current/Good_Intentions.current.epub books/good-intentions/source/Good_Intentions.epub
          test "$(sha256sum books/good-intentions/source/Good_Intentions.epub | awk '{print $1}')" = \
            "29f7a0e45d519072e4ab29fde061d37d553fa3a15916a5914c3a0abc5d4fe1c1"

      - name: Restore and verify canonical extracted corpus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf books/good-intentions/extracted
          mkdir -p books/good-intentions/extracted
          python scripts/restore_good_intentions_state.py
          cat .sync/good-intentions/patch.part-* | base64 -d | gzip -d > /tmp/good-intentions-extract.patch
          (cd books/good-intentions/extracted && patch -p1 < /tmp/good-intentions-extract.patch)
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('books/good-intentions/extracted')
          files = sorted(root.glob('*.md'))
          if len(files) != 205:
              raise SystemExit(f'expected 205 extracted files, found {len(files)}')
          manifest = ''.join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
              for p in files
          ).encode()
          got = hashlib.sha256(manifest).hexdigest()
          expected = 'e74948d3f6e458a2de7b2a86f55588f2e733890ab354d788c3d1ed6b7a223393'
          print(f'extracted files: {len(files)}')
          print(f'aggregate sha256: {got}')
          if got != expected:
              raise SystemExit(f'canonical corpus hash mismatch: {got} != {expected}')
          PY
          rm -rf books/good-intentions/source

      - name: Commit restored corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "book-translator restore"
          git config user.email "108188608+tim8es@users.noreply.github.com"
          git add books/good-intentions/extracted
          if git diff --cached --quiet; then
            echo "Corpus already canonical; nothing to commit."
            exit 0
          fi
          git commit -m "source: restore complete verified Good Intentions corpus"
          git push origin HEAD:work/good-intentions-ru-20260903
